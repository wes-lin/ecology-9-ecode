name: Release

run-name: Release ${{ inputs.target }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        required: true
        description: Package to release
        default: all
        options:
          - all
          - sdk
          # - runtime
          - plugin
      prerelease:
        type: boolean
        required: false
        description: Mark the plugin GitHub Release as a prerelease
        default: false
      marketplace:
        type: boolean
        required: false
        description: Publish the plugin to the Visual Studio Marketplace
        default: true
      openvsx:
        type: boolean
        required: false
        description: Publish the plugin to the Open VSX Registry
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish-sdk:
    name: Publish SDK to npm
    if: ${{ inputs.target == 'all' || inputs.target == 'sdk' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test SDK
        run: pnpm --filter ecode-sdk test

      - name: Publish SDK
        working-directory: packages/ecode-sdk
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  # publish-runtime:
