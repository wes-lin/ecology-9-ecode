  package-plugin:
    name: Package VS Code plugin
    if: ${{ inputs.target == 'all' || inputs.target == 'plugin' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test plugin
        run: pnpm --filter vscode-ecode test

      - name: Package plugin
        run: pnpm --filter vscode-ecode package

      - name: Resolve plugin release metadata
        id: plugin
        shell: bash
        run: |
          version="$(node -p "require('./packages/vscode-ecode/package.json').version")"
          vsix_path="$(find packages/vscode-ecode/releases -maxdepth 1 -type f -name '*.vsix' -print -quit)"
          if [[ -z "$vsix_path" ]]; then
            echo "Plugin package was not generated." >&2
            exit 1
          fi
          is_prerelease=false
          if [[ "$version" == *-* ]]; then
            is_prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=vscode-ecode-v$version" >> "$GITHUB_OUTPUT"
          echo "vsix_name=$(basename "$vsix_path")" >> "$GITHUB_OUTPUT"
          echo "vsix_path=$vsix_path" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-ecode-vsix
          path: ${{ steps.plugin.outputs.vsix_path }}
          if-no-files-found: error
          retention-days: 30

    outputs:
      version: ${{ steps.plugin.outputs.version }}
      tag: ${{ steps.plugin.outputs.tag }}
      vsix_name: ${{ steps.plugin.outputs.vsix_name }}
      is_prerelease: ${{ steps.plugin.outputs.is_prerelease }}

  release-plugin:
    name: Publish plugin to GitHub Releases
    needs: package-plugin
    if: ${{ inputs.target == 'all' || inputs.target == 'plugin' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vscode-ecode-vsix
          path: artifacts

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_TAG: ${{ needs.package-plugin.outputs.tag }}
          PLUGIN_VERSION: ${{ needs.package-plugin.outputs.version }}
          VSIX_PATH: artifacts/${{ needs.package-plugin.outputs.vsix_name }}
        run: |
          release_options=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "$VSIX_PATH" \
            --target "$GITHUB_SHA" \
            --title "eCode Explorer v$PLUGIN_VERSION" \
            --generate-notes \
            "${release_options[@]}"

  publish-marketplace:
    name: Publish plugin to Visual Studio Marketplace
    needs: package-plugin
    if: >-
      ${{ (inputs.target == 'all' || inputs.target == 'plugin') &&
          inputs.marketplace }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vscode-ecode-vsix
          path: artifacts

      - name: Publish to Visual Studio Marketplace
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          IS_PRERELEASE: ${{ needs.package-plugin.outputs.is_prerelease }}
          VSIX_PATH: ${{ github.workspace }}/artifacts/${{ needs.package-plugin.outputs.vsix_name }}
        run: |
          publish_options=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            publish_options+=(--pre-release)
          fi
          pnpm --filter vscode-ecode exec vsce publish \
            --packagePath "$VSIX_PATH" \
            "${publish_options[@]}"

  publish-openvsx:
    name: Publish plugin to Open VSX Registry
    needs: package-plugin
    if: >-
      ${{ (inputs.target == 'all' || inputs.target == 'plugin') &&
          inputs.openvsx }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vscode-ecode-vsix
          path: artifacts

      - name: Publish to Open VSX Registry
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX_PATH: ${{ github.workspace }}/artifacts/${{ needs.package-plugin.outputs.vsix_name }}
        run: npx --yes ovsx publish "$VSIX_PATH" --pat "$OVSX_PAT"
